# Build the patched firmware and publish it as a release asset.
#
# This exists because docs/firmware.md offers "flash the prebuilt image" as the easy path,
# and a prebuilt image has to come from somewhere reproducible. Committing a 3 MB binary
# would put the artifact in git history and say nothing about how it was produced; building
# it here means the published image is always the pinned submodule compiled by
# tools/build_firmware.sh -- including that script's nine patch-verification gates, which
# refuse to produce an image that cannot do realtime mode.
#
# The submodule pointer is the trigger by design: bumping it is what changes which firmware
# this repo ships, so tagging after a bump is the moment a new image is warranted.
#
# Run it from the Actions tab (workflow_dispatch) to check a build without publishing.

name: firmware release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install arduino-cli
        run: |
          # The install script refuses to create BINDIR itself.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      # Core 2.x, NOT 3.x: src/PetoiESP32Servo calls ledcSetup()/ledcAttachPin(), which core
      # 3.0 removed. The version is pinned in build_firmware.sh and checked by it.
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install ArduinoJson WebSockets WiFiManager
          # MuVisionSensor3 is not in the library index, so it is cloned into whatever
          # arduino-cli reports as its user directory rather than a hardcoded path (the
          # macOS ~/Documents/Arduino in build_firmware.sh's error message is not it here).
          LIBDIR="$(arduino-cli config get directories.user)/libraries"
          mkdir -p "$LIBDIR"
          git -C "$LIBDIR" clone --depth 1 \
            https://github.com/mu-opensource/MuVisionSensor3.git

      # Pinned below 5.x: esptool 5 dropped the `esptool.py` entry point that this workflow
      # and docs/firmware.md both invoke by name.
      - name: Install esptool
        run: pipx install 'esptool<5' || pip install --user 'esptool<5'

      - name: Build
        run: tools/build_firmware.sh

      # The build is compile-time specific to one robot, board and revision, and flashing
      # it onto a different one moves the wrong servos or reads battery voltage off the
      # wrong pin. tools/firmware_target.py reads that out of the tree that was actually
      # compiled -- the same function tools/flash_firmware.py gates on, so the image, its
      # name, its notes and the flash-time check cannot disagree with each other.
      # Runs BEFORE the merge because the filename is built from its outputs.
      - name: Record what it was built for
        id: target
        run: python3 tools/firmware_target.py --github-output >> "$GITHUB_OUTPUT"

      # arduino-cli emits three binaries that must be flashed together, at three offsets,
      # under a partition scheme (huge_app) that is NOT the ESP32 default. Publishing only
      # the app image would let someone flash it onto a board still carrying a 1.25 MB app
      # partition and run off the end of the slot. Merging removes both hazards, and is the
      # same recipe as docs/firmware.md's maintainer section.
      #
      # The filename carries board, revision and upstream firmware date because a downloaded
      # .bin outlives the release page it came from, and those are exactly the choices that
      # decide whether flashing it is safe.
      - name: Merge into a single flashable image
        id: merge
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          BOARD="$(echo '${{ steps.target.outputs.board }}' | tr '[:upper:]' '[:lower:]')"
          REV="$(echo '${{ steps.target.outputs.rev }}' | tr '[:upper:]' '[:lower:]')"
          OUT="bittle-rl-${VERSION}-${BOARD}-${REV}-fw${{ steps.target.outputs.fw_date }}.bin"

          cd build/firmware/patched/bin
          esptool.py --chip esp32 merge_bin -o "$OUT" \
            --flash_mode qio --flash_freq 80m --flash_size 4MB \
            0x1000  OpenCatEsp32.ino.bootloader.bin \
            0x8000  OpenCatEsp32.ino.partitions.bin \
            0x10000 OpenCatEsp32.ino.bin

          md5sum "$OUT" | tee "$OUT.md5"

          # Machine-readable target, so tools/flash_firmware.py can gate a DOWNLOADED
          # image with no repo checkout. The filename encodes board and revision too, but
          # parsing a filename is fragile and says nothing about the md5.
          SIDECAR="${OUT%.bin}.json"
          python3 "$GITHUB_WORKSPACE/tools/firmware_target.py" \
            --tree "$GITHUB_WORKSPACE/firmware" \
            --extra "tag=$VERSION" \
            --extra "asset=$OUT" \
            --extra "md5=$(md5sum "$OUT" | cut -d' ' -f1)" \
            --extra "bytes=$(wc -c < "$OUT")" > "$SIDECAR"
          cat "$SIDECAR"

          {
            echo "sidecar=build/firmware/patched/bin/$SIDECAR"
            echo "version=$VERSION"
            echo "asset=$OUT"
            echo "image=build/firmware/patched/bin/$OUT"
            echo "md5=$(md5sum "$OUT" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "$OUT")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: bittle-rl-firmware
          path: |
            build/firmware/patched/bin/bittle-rl-*.bin
            build/firmware/patched/bin/bittle-rl-*.bin.md5
            build/firmware/patched/bin/bittle-rl-*.json

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Patched OpenCat firmware, built from the pinned \`firmware/\` submodule by
          \`tools/build_firmware.sh\`. Realtime mode (\`XR\`/\`Xr\`) is **off at boot**, so a
          flashed robot behaves exactly like stock until something asks for it.

          | | |
          |---|---|
          | robot | \`${{ steps.target.outputs.robot }}\` |
          | board | \`${{ steps.target.outputs.board }}\` |
          | revision | \`${{ steps.target.outputs.rev }}\` |
          | firmware date | ${{ steps.target.outputs.fw_date }} |
          | submodule commit | \`${{ steps.target.outputs.submodule }}\` |
          | md5 | \`${{ steps.merge.outputs.md5 }}\` |
          | bytes | ${{ steps.merge.outputs.bytes }} |

          **This image is compile-time specific to the robot, board and revision above.**
          Anything else needs its own build -- see \`docs/firmware.md\` Option B.

          \`\`\`
          esptool.py --chip esp32 --port /dev/ttyUSB0 write_flash 0x0 ${{ steps.merge.outputs.asset }}
          \`\`\`

          Verify the md5 first, and do **not** run \`esptool erase_flash\` -- it wipes the
          \`nvs\` partition holding your robot's factory servo calibration. A normal flash
          preserves it.
          EOF
          # Idempotent: re-running a tag build must not fail because the release exists.
          # --clobber replaces an asset of the same name; assets whose names changed are
          # removed first so a release never carries two differently-named copies of the
          # same image.
          IMG="${{ steps.merge.outputs.image }}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            for old in $(gh release view "${GITHUB_REF_NAME}" \
                           --json assets --jq '.assets[].name'); do
              case "$old" in
                "${{ steps.merge.outputs.asset }}"|"${{ steps.merge.outputs.asset }}.md5") ;;
                *) gh release delete-asset "${GITHUB_REF_NAME}" "$old" --yes ;;
              esac
            done
            # --draft=false is not redundant: deleting a tag to move it demotes its
            # release to a draft, and `edit` alone would leave it there -- assets updated,
            # release invisible.
            gh release edit "${GITHUB_REF_NAME}" --draft=false \
              --title "Firmware ${GITHUB_REF_NAME}" --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" "$IMG" "$IMG.md5" \
              "${{ steps.merge.outputs.sidecar }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Firmware ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "$IMG" "$IMG.md5" "${{ steps.merge.outputs.sidecar }}"
          fi
